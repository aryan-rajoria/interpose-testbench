name: pr-interpose-testbench

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build universal interposer artifacts (1 per arch)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure arm64 binfmt (emulated builds)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build artifact-builder images
        run: |
          docker build --platform linux/amd64 --build-arg BASE_IMAGE=alpine:latest \
            -f docker/Dockerfile -t interpose:alpine-musl .
          docker build --platform linux/arm64 --build-arg BASE_IMAGE=alpine:latest \
            -f docker/Dockerfile -t interpose:alpine-musl-arm64 .

      - name: Build the 2 universal artifacts
        run: sh tests/build_artifacts.sh

      - uses: actions/upload-artifact@v4
        with:
          name: interpose-artifacts
          path: dist/

      - name: Clean images
        if: always()
        run: docker image rm -f interpose:alpine-musl interpose:alpine-musl-arm64 || true

  interpose:
    name: ${{ matrix.scenario }} / ${{ matrix.build_system }}
    needs: build-artifacts
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ubuntu-20.04-glibc
          - ubuntu-22.04-glibc
          - ubuntu-24.04-glibc
          - alpine-musl
          - ubuntu-24.04-glibc-arm64
          - alpine-musl-arm64
        build_system:
          - make
          - cmake-make
          - cmake-ninja
          - autotools
          - meson
          - ninja
        include:
          - scenario: ubuntu-20.04-glibc
            base_image: ubuntu:20.04
            platform: linux/amd64
            artifact: libinterpose-x86_64.so
          - scenario: ubuntu-22.04-glibc
            base_image: ubuntu:22.04
            platform: linux/amd64
            artifact: libinterpose-x86_64.so
          - scenario: ubuntu-24.04-glibc
            base_image: ubuntu:24.04
            platform: linux/amd64
            artifact: libinterpose-x86_64.so
          - scenario: alpine-musl
            base_image: alpine:latest
            platform: linux/amd64
            artifact: libinterpose-x86_64.so
          - scenario: ubuntu-24.04-glibc-arm64
            base_image: ubuntu:24.04
            platform: linux/arm64
            artifact: libinterpose-aarch64.so
          - scenario: alpine-musl-arm64
            base_image: alpine:latest
            platform: linux/arm64
            artifact: libinterpose-aarch64.so
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: interpose-artifacts
          path: dist/

      - name: Ensure arm64 binfmt (emulated scenarios)
        if: matrix.platform == 'linux/arm64'
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build scenario image
        run: |
          docker build --platform ${{ matrix.platform }} \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            -f docker/Dockerfile \
            -t interpose:${{ matrix.scenario }} .

      - name: Run ${{ matrix.build_system }} scenario
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            -e INTERPOSE_LIB=/src/dist/${{ matrix.artifact }} \
            interpose:${{ matrix.scenario }} \
            sh tests/run_scenario.sh ${{ matrix.build_system }}

      - name: Clean image
        if: always()
        run: docker image rm -f interpose:${{ matrix.scenario }} || true

  timing:
    name: Timing report
    needs: [interpose]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Compute per-job and total durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            -o /tmp/jobs.json
          python3 - <<'EOF'
          import json, datetime, os
          def ts(s): return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))
          jobs = json.load(open("/tmp/jobs.json"))["jobs"]
          rows = []
          for j in jobs:
              if not j.get("startedAt") or not j.get("completedAt"):
                  continue
              rows.append((j["name"], (ts(j["completedAt"]) - ts(j["startedAt"])).total_seconds(), j["conclusion"]))
          total = (max(ts(j["completedAt"]) for j in jobs if j.get("completedAt"))
                   - min(ts(j["startedAt"]) for j in jobs if j.get("startedAt"))).total_seconds()
          run_sum = sum(d for _, d, _ in rows)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"), "a") as f:
              f.write("## Timing report\n\n")
              f.write(f"- **total wall clock: {total/60:.1f} min**\n")
              f.write(f"- sum of all jobs (single-runner serial cost): {run_sum/60:.1f} min\n")
              f.write(f"- jobs: {len(rows)}\n\n")
              f.write("| job | duration (s) | result |\n|---|---|---|\n")
              for name, dur, concl in sorted(rows, key=lambda r: -r[1]):
                  f.write(f"| {name} | {dur:.0f} | {concl} |\n")
          print(f"total wall: {total:.0f}s, sum of jobs: {run_sum:.0f}s, jobs: {len(rows)}")
          EOF
